name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unar (CBR / 7z extraction)
        run: sudo apt-get update && sudo apt-get install -y unar
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Audit dependencies for known CVEs
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check ES modules
        run: for f in $(find web/js -name '*.js'); do node --check "$f"; done
      - name: Run layout tests
        run: node --test tests/js/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t comic-cascade:ci .
